SPECIFICATION FairSpec

CONSTANTS
  Clients = {c1}
  Threads = {t1}
  NONE = none
  ProviderVersion = 1
  RequestVersions = {1, 2}
  Mode = "Serial"
  HomeThread = t1
  SnapshotAliases = TRUE
  Total = 1
  MaxPage = 1
  MaxGeneration = 2
  MaxOutput = 1

INVARIANTS
  TypeOK
  RetainsEqualOwners
  PageBounded
  CancelledNeverOpen

PROPERTY CursorEventuallyClosed

CHECK_DEADLOCK FALSE
