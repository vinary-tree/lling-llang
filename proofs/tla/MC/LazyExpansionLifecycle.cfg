SPECIFICATION Spec

CONSTANTS
  States = {s0, s1}
  Workers = {w0, w1}
  Snapshots = {snapshot0, snapshot1}
  InitialSnapshot = snapshot0
  MaxAttempts = 2
  NONE = none

INVARIANT TypeOK
INVARIANT AtMostOneExpansionOwner
INVARIANT OwnerExactlyWhileExpanding
INVARIANT ExpandingUsesCapturedSnapshot
INVARIANT ObservableStateUsesCurrentSnapshot
INVARIANT UnexpandedNeverAppearsEmpty
INVARIANT ExpandingIsUnobservable
INVARIANT EmptyObservationIsExact
INVARIANT NonemptyObservationIsExact
INVARIANT FailureObservationHasExactStatus
INVARIANT CancellationObservationHasExactStatus
INVARIANT RetryFlagOnlyOnFailure
INVARIANT NonRetryableFailureIsTerminal
INVARIANT ExpandedExactlyCacheable
INVARIANT IncompleteStatesAreNotCacheable
INVARIANT AttemptCountIsBounded
INVARIANT CancelledHasNoOwner
INVARIANT FailedHasNoOwner

CHECK_DEADLOCK FALSE
