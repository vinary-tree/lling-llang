# cargo-deny configuration for lling-llang.
#
# Added 2026-07 after a fleet-wide OSV sweep found five advisories in this locked
# tree -- memmap2 and crossbeam-epoch soundness bugs, a rand unsoundness, and two
# copies of the unmaintained bincode -- none of which anything was watching for.
#
#     cargo deny check
#
# Mirrors the configuration in libdictenstein and liblevenshtein; keep them in step.

[graph]
all-features = true

[advisories]
yanked = "deny"

# Every entry MUST carry a reason and a REVIEW-BY date. An advisory with no fixed
# version is a standing risk to re-evaluate, not something to mute permanently.
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "REVIEW-BY 2026-10-31. bincode is unmaintained with no fixed version; 3.0.0 is a tombstone containing only a compiler error. Reached here only transitively via libdictenstein/liblevenshtein -- the local `bincode-ser` feature declares it but contains no `bincode::` call sites at all. Fleet-wide migration to bincode-next is planned." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
# "warn" for now; ratchet to "deny" once the remaining transitive duplicates clear.
multiple-versions = "warn"
wildcards = "deny"

deny = [
  { crate = "bincode:>=3.0.0", reason = "bincode 3.0.0 is a deliberate tombstone release and does not compile" },
  { crate = "paste", reason = "unmaintained (RUSTSEC-2024-0436); use `pastey`" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
