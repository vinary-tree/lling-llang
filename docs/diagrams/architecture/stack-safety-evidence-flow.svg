<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="857px" preserveAspectRatio="none" style="width:1091px;height:857px;background:#FFFFFF;" version="1.1" viewBox="0 0 1091 857" width="1091px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="271.151" x="409.402" y="34.9659">Formal-first stack-safety evidence flow</text></g><ellipse cx="569.9135" cy="65.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFF59D" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="178.8571" x="480.485" y="95.0679"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="143.077" x="490.485" y="117.896">Exact source revision and</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="158.8571" x="490.485" y="134.2401">pgmcp/libcpg SCC discovery</text><rect fill="#FFF59D" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="248.9617" x="445.4327" y="167.7561"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="186.6134" x="455.4327" y="190.5842">Corroborate recursive equations,</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="228.9617" x="455.4327" y="206.9283">observables, lifecycle, and false positives</text><rect fill="#FFCDD2" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="182.2652" x="478.781" y="240.4444"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="162.2652" x="488.781" y="263.2725">Rocq &#183; TLA+/TLC &#183; SMT model</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="124.2009" x="488.781" y="279.6166">with no proof escapes</text><rect fill="#E1BEE7" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="265.6538" x="437.0867" y="313.1326"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="151.177" x="447.0867" y="335.9607">Extract every invariant into</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="245.6538" x="447.0867" y="352.3048">properties and causal required-red controls</text><rect fill="#B2DFDB" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="203.5893" x="468.1189" y="385.8208"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="183.5893" x="478.1189" y="408.6489">Implement the specialized typed</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="130.1529" x="478.1189" y="424.993">heap-resident machine</text><rect fill="#C8E6C9" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="248.6856" x="445.5707" y="458.5091"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="186.2533" x="455.5707" y="481.3371">Run 100,000-level / 256-KiB tests,</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="228.6856" x="455.5707" y="497.6813">work &#183; allocation &#183; RSS &#183; malformed gates</text><polygon fill="#ECEFF1" points="498.3755,531.1973,641.4515,531.1973,653.4515,543.1973,641.4515,555.1973,498.3755,555.1973,486.3755,543.1973,498.3755,531.1973" style="stroke:#455A64;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#102027" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="143.076" x="498.3755" y="547.4653">All acceptance gates green?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="469.2927" y="539.9743">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="653.4515" y="539.9743">no</text><rect fill="#C8E6C9" height="36.3441" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="240.7776" x="160.9149" y="565.1973"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="220.7776" x="170.9149" y="588.0254">Bind ledger rows to immutable commit</text><rect fill="#BBDEFB" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="217.8574" x="172.375" y="636.5414"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="197.8574" x="182.375" y="659.3695">Run fresh full-source pgmcp/libcpg</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="150.7091" x="182.375" y="675.7136">recursion and SCC analysis</text><polygon fill="#ECEFF1" points="193.1833,709.2296,369.4241,709.2296,381.4241,721.2296,369.4241,733.2296,193.1833,733.2296,181.1833,721.2296,193.1833,709.2296" style="stroke:#455A64;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#102027" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="176.2408" x="193.1833" y="725.4976">Every result has exact disposition?</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="164.1004" y="718.0067">yes</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="381.4241" y="718.0067">no</text><rect fill="#C8E6C9" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="221.0614" x="16" y="743.2296"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="201.0614" x="26" y="766.0577">Attach hashes and trusted evidence</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="53.8324" x="26" y="782.4018">to pgmcp</text><ellipse cx="126.5307" cy="826.9179" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="126.5307" cy="826.9179" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFCDD2" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="358.0305" x="257.0614" y="743.2296"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="173.7372" x="267.0614" y="766.0577">Return uncovered source edge</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="338.0305" x="267.0614" y="782.4018">to formal modeling before another implementation revision</text><ellipse cx="436.0767" cy="826.9179" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="436.0767" cy="826.9179" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFCDD2" height="52.6882" rx="12.5" ry="12.5" style="stroke:#F9A825;stroke-width:0.5;" width="426.863" x="645.0919" y="565.1973"/><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="192.8414" x="655.0919" y="588.0254">Minimize the counterexample and</text><text fill="#102027" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="406.863" x="655.0919" y="604.3695">strengthen the formal invariant before another implementation revision</text><ellipse cx="858.5234" cy="663.8855" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="858.5234" cy="663.8855" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#455A64;stroke-width:1.5;" x1="569.9135" x2="569.9135" y1="75.0679" y2="95.0679"/><polygon fill="#455A64" points="565.9135,85