.553" font-family="Verdana">Return typed start/count error;</text><text x="60.552" y="331.28" fill="#000" font-size="12" textLength="24.72" font-family="Verdana">stop</text><text x="54.312" y="347.624" fill="#000" font-size="12" textLength="28.788" font-family="Verdana">endif</text><text x="54.312" y="363.968" fill="#000" font-size="12" textLength="315.806" font-family="Verdana">:Scan every outgoing slice in\nstate and transition order</text><rect x="11" y="452.939" width="402.431" height="85.376" fill="#E7F3FF" style="stroke:#235789;stroke-width:1;" rx="12.5" ry="12.5"/><text x="21" y="475.767" fill="#000" font-size="12" textLength="382.431" font-family="Verdana">Return typed transition error\nwith original identity and arc ordinal;</text><text x="27.24" y="492.111" fill="#000" font-size="12" textLength="24.72" font-family="Verdana">stop</text><text x="21" y="508.455" fill="#000" font-size="12" textLength="28.788" font-family="Verdana">endif</text><text x="21" y="524.799" fill="#000" font-size="12" textLength="222.35" font-family="Verdana">:Check weight epsilon and determinism</text><rect x="114.795" y="607.806" width="194.841" height="52.688" fill="#E7F3FF" style="stroke:#235789;stroke-width:1;" rx="12.5" ry="12.5"/><text x="124.795" y="630.634" fill="#000" font-size="12" textLength="174.841" font-family="Verdana">Clone input, optionally connect</text><text x="124.795" y="646.978" fill="#000" font-size="12" textLength="99.901" font-family="Verdana">and push weights</text><rect x="106.965" y="688.157" width="210.501" height="36.344" fill="#E7F3FF" style="stroke:#235789;stroke-width:1;" rx="12.5" ry="12.5"/><text x="116.965" y="710.985" fill="#000" font-size="12" textLength="190.501" font-family="Verdana">Refine partitions and build output</text><rect x="76.898" y="755.829" width="270.634" height="85.376" fill="#E7F3FF" style="stroke:#235789;stroke-width:1;" rx="12.5" ry="12.5"/><text x="86.898" y="778.657" fill="#000" font-size="12" textLength="137.389" font-family