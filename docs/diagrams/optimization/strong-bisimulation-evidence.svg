<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="934px" preserveAspectRatio="none" style="width:885px;height:934px;background:#FFFFFF;" version="1.1" viewBox="0 0 885 934" width="885px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="11"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="349.4386" x="264.4218" y="24.9659">Strong-bisimulation pre-implementation evidence</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="430.911" x="223.6856" y="40.8268">every executable path is bounded, headless, repository-backed, and zero-swap</text></g><!--entity CONTRACT--><g class="entity" data-qualified-name="CONTRACT" data-source-line="13" id="ent0001"><rect fill="#FFF59D" height="96.2717" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="278.397" x="306.86" y="62.0498"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="137.7735" x="377.1717" y="87.0157">Normative contract</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.9671" x="332.5749" y="106.0837">labelled transfer in both directions</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.1831" x="332.9669" y="125.1516">validated input &#183; canonical relation</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="258.397" x="316.86" y="144.2195">certificate &#183; witness &#183; resource envelope</text></g><!--entity ROCQ--><g class="entity" data-qualified-name="ROCQ" data-source-line="15" id="ent0002"><rect fill="#FFCDD2" height="115.3396" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="286.111" x="7" y="218.3198"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="34.0059" x="133.0526" y="243.2857">Rocq</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.9554" x="70.5778" y="262.3537">unbounded equivalence</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.5455" x="83.2827" y="281.4216">certificate exactness</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266.111" x="17" y="300.4895">modal witness soundness/completeness</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.435" x="26.338" y="319.5574">termination and resource inequalities</text></g><!--entity TLA--><g class="entity" data-qualified-name="TLA" data-source-line="16" id="ent0003"><rect fill="#FFCDD2" height="96.2717" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="235.7672" x="328.17" y="227.8498"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="71.5817" x="410.2627" y="252.8157">TLA+ / TLC</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.8053" x="357.6509" y="271.8837">14,916 valid lifecycle states</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.7672" x="338.17" y="290.9516">3 malformed dense-input modes</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.9572" x="341.075" y="310.0195">safety and eventual termination</text></g><!--entity SMT--><g class="entity" data-qualified-name="SMT" data-source-line="17" id="ent0004"><rect fill="#E1BEE7" height="96.2717" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="257.8031" x="599.15" y="227.8498"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="16.1139" x="719.9946" y="252.8157">Z3</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.2453" x="632.9289" y="271.8837">15 exact SAT/UNSAT controls</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237.8031" x="609.15" y="290.9516">validation &#183; refinement &#183; canonicality</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.4373" x="645.3329" y="310.0195">work &#183; heap &#183; native stack</text></g><!--entity ORACLE--><g class="entity" data-qualified-name="ORACLE" data-source-line="18" id="ent0005"><rect fill="#C8E6C9" height="96.2717" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="263.515" x="314.3" y="393.6598"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="123.2415" x="384.4368" y="418.6257">Executable oracle</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="243.515" x="324.3" y="437.6937">5,124 complete small LTS/color cases</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="216.6492" x="337.7329" y="456.7616">independent greatest fixed point</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.8692" x="336.1229" y="475.8295">stack-safe characteristic formulas</text></g><!--entity MUTANTS--><g class="entity" data-qualified-name="MUTANTS" data-source-line="19" id="ent0006"><rect fill="#FFCDD2" height="77.2038" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="229.6212" x="331.24" y="549.9298"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="125.8735" x="383.1138" y="574.8957">Mutation controls</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.2693" x="352.916" y="593.9637">10 injected semantic defects</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.6212" x="341.24" y="613.0316">all killed for their named reason</text></g><!--entity RED--><g class="entity" data-qualified-name="RED" data-source-line="20" id="ent0007"><rect fill="#FFE0B2" height="77.2038" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="290.983" x="300.56" y="687.1298"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="126.1115" x="382.9957" y="712.0957">Required-red Rust</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.2354" x="366.4338" y="731.1637">13 future-API properties</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="270.983" x="310.56" y="750.2316">red only on missing CertifiedBisimulation</text></g><!--entity GATE--><g class="entity" data-qualified-name="GATE" data-source-line="21" id="ent0008"><rect fill="#BBDEFB" height="96.2717" rx="6" ry="6" style="stroke:#181818;stroke-width:0.5;" width="305.5709" x="293.27" y="824.3398"/><text fill="#102027" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="228.8291" x="331.6409" y="849.3057">Production implementation gate</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.4769" x="304.817" y="868.3737">no Rust algorithm change in this milestone</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="285.5709" x="303.27" y="887.4416">future code must turn red properties green</text><text fill="#102027" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.8432" x="345.6339" y="906.5095">and preserve every ledger row</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="34" id="ent0019"><path d="M633.82,832.0598 L633.82,868.4698 L599.06,872.4698 L633.82,876.4698 L633.82,912.8839 A0,0 0 0 0 633.82,912.8839 L870.2822,912.8839 A0,0 0 0 0 870.2822,912.8839 L870.2822,842.0598 L860.2822,832.0598 L633.82,832.0598 A0,0 0 0 0 633.82,832.0598" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M860.2822,832.0598 L860.2822,842.0598 L870.2822,842.0598 L860.2822,832.0598" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7641" x="657.669" y="850.9568">No unchecked proof escapes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.4622" x="639.82" y="868.6628">No malformed endpoint is skipped.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.2082" x="643.447" y="886.3689">No recursive production traversal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3501" x="663.376" y="904.0749">No whole-partition rescans.</text></g><!--link CONTRACT to ROCQ--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="23" id="lnk9"><path d="M360.04,158.7798 C326.67,177.2498 292.5451,196.1394 257.6951,215.4194" fill="none" id="CONTRACT-to-ROCQ" style="stroke:#607D8B;stroke-width:1.4;"/><polygon fill="#607D8B" points="253.32,217.8398,263.1315,216.9831,257.6951,215.4194,259.2588,209.9829,253.32,217.8398" style="stroke:#607D8B;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CONTRACT to TLA--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="24" id="lnk10"><path d="M446.06,158.5598 C446.06,180.1998 446.06,200.7698 446.06,222.4298" fill="none" id="CONTRACT-to-TLA" style="stroke:#607D8B;stroke-width:1.4;"/><polygon fill="#607D8B" points="446.06,227.4298,450.06,218.4298,446.06,222.4298,442.06,218.4298,446.06,227.4298" style="stroke:#607D8B;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CONTRACT to SMT--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="25" id="lnk11"><path d="M528,158.7798 C565.24,180.4098 604.8666,203.4283 642.0666,225.0383" fill="none" id="CONTRACT-to-SMT" style="stroke:#607D8B;stroke-width:1.4;"/><polygon fill="#607D8B" points="646.39,227.5498,640.617,219.5703,642.0666,225.0383,636.5986,226.4878,646.39,227.5498" style="stroke:#607D8B;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link ROCQ to ORACLE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="26" id="lnk12"><path d="M253.17,334.0498 C288.04,353.3498 322.2053,372.2587 355.6153,390.7487" fill="none" id="ROCQ-to-ORACLE" style="stroke:#607D8B;stroke-width:1.4;"/><polygon fill="#607D8B" points="359.99,393.1698,354.0524,385.312,355.6153,390.7487,350.1786,392.3116,359.99,393.1698" style="stroke:#607D8B;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link TLA to ORACLE--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="27" id="lnk13"><path d="M446.06,324.3698 C446.06,346.0098 446.06,366.5798 446.06,388.2398" fill="none" id="TLA-to-ORACLE" style="stroke:#607D8B;stroke-width:1.4;"/><polygon fill="#607D8B" points="446.06,393.2398,450.06,384.2398,446.06,388.2398,442.06,384.2398,446.06,393.2398" style="stroke:#607D8B;stroke-width:1.4;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link SMT to ORACLE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="28" id="lnk14"><path d="M646.11,324.5898 C608.87,346.2198 569.2434,369.2383 532.