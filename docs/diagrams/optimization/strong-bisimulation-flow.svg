<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1120px" preserveAspectRatio="none" style="width:583px;height:1120px;background:#FFFFFF;" version="1.1" viewBox="0 0 583 1120" width="583px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="14"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="262.219" x="159.4788" y="34.9659">Certified strong-bisimulation pipeline</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="396.8221" x="92.1772" y="50.8268">validated dense LTS &#183; Valmari refinement &#183; replay certificate &#183; modal DAG</text></g><ellipse cx="298.2478" cy="80.0498" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#BBDEFB" height="69.0323" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="202.5213" x="196.9872" y="110.0498"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.6252" x="212.4352" y="132.8779">Raw labelled transition system</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.9329" x="206.9872" y="149.222">state count &#183; arbitrary</text><text fill="#102027" font-family="sans-serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="21.5281" x="332.0401" y="149.222">u32</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="32.8202" x="356.6882" y="149.222">labels</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.653" x="229.4213" y="165.5661">transitions &#183; initial colors</text><polygon fill="#ECEFF1" points="206.085,199.0821,390.4107,199.0821,402.4107,214.064,390.4107,229.0459,206.085,229.0459,194.085,214.064,206.085,199.0821" style="stroke:#455A64;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#102027" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="184.3257" x="206.085" y="210.8411">Every source and target is in range?</text><text fill="#102027" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="155.1539" x="220.6709" y="225.8229">Color vector has exact length?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="177.0021" y="210.8411">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="402.4107" y="210.8411">no</text><rect fill="#B2DFDB" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="293.17" x="16" y="239.0459"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.17" x="26" y="261.874">Canonicalize labels with fixed-width radix passes</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.7457" x="42.2121" y="278.2181">sort and deduplicate set-valued transitions</text><rect fill="#FFCDD2" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="209.4813" x="329.17" y="239.0459"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.8252" x="351.9981" y="261.874">Return typed validation error</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.4813" x="339.17" y="278.2181">without indexing malformed data</text><ellipse cx="433.9106" cy="322.7342" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="433.9106" cy="322.7342" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#B2DFDB" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="244.4496" x="176.023" y="353.7342"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.3372" x="212.5792" y="376.5622">Build forward and reverse CSR</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.4496" x="186.023" y="392.9064">plus refinable state/transition partitions</text><rect fill="#C8E6C9" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="168.3331" x="214.0813" y="426.4224"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.3331" x="224.0813" y="449.2505">Seed blocks by initial color</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.9409" x="239.7774" y="465.5946">seed splitter worklist</text><rect fill="#C8E6C9" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="244.3776" x="176.059" y="556.3695"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.3776" x="186.059" y="579.1976">Count predecessors by action and block</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.4168" x="242.0394" y="595.5417">using explicit arrays</text><rect fill="#C8E6C9" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="245.5656" x="175.465" y="629.0577"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="225.5656" x="185.465" y="651.8858">Split affected state and transition blocks</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.6251" x="221.4353" y="668.23">queue only the smaller half</text><rect fill="#E1BEE7" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="260.5297" x="167.983" y="701.746"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.5297" x="177.983" y="724.5741">Append safe split and shared modal nodes</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.1051" x="221.1953" y="740.9182">to replay and witness DAGs</text><polygon fill="#ECEFF1" points="227.5568,499.1106,368.9388,499.1106,380.9388,511.1106,368.9388,523.1106,227.5568,523.1106,215.5568,511.1106,227.5568,499.1106" style="stroke:#455A64;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.0829" x="302.2478" y="534.8695">yes</text><text fill="#102027" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="141.382" x="227.5568" y="515.3786">Splitter worklist nonempty?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.4529" x="202.1039" y="507.8876">no</text><rect fill="#C8E6C9" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="168.1651" x="214.1653" y="796.4342"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.1651" x="224.1653" y="819.2623">Assign canonical block IDs</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.473" x="229.5113" y="835.6064">in increasing state order</text><rect fill="#FFCDD2" height="52.6882" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="201.0813" x="197.7072" y="869.1224"/><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.0813" x="207.7072" y="891.9505">Independently replay every split</text><text fill="#102027" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.4009" x="232.5474" y="908.2946">and check final stability</text><polygon fill="#ECEFF1" points=