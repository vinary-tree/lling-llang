[package]
name = "lling-llang"
version = "4.0.0-rc.5"
edition = "2021"
# `div_ceil` (integer) is used across gpu/load_balance, llm token-masking, and the
# quantized semiring; it stabilized in Rust 1.73, so 1.73 is the true MSRV.
# Matches the libdictenstein / liblevenshtein path dependencies, whose --all-features
# floor is set by sysinfo 0.39 (1.95).
rust-version = "1.95"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
description = "WFST framework for text normalization and grammar correction"
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/lling-llang"
keywords = ["wfst", "lattice", "cfg", "text-normalization", "grammar-correction"]
categories = ["text-processing", "algorithms"]

[dependencies]
vinary-tree-interop = { path = "../vinary-tree-interop", version = "=4.0.0-rc.5", optional = true }
# Core dependencies (optional - for liblevenshtein integration)
liblevenshtein = { path = "../liblevenshtein-rust", version = "=4.0.0-rc.5", optional = true }
libdictenstein = { path = "../libdictenstein", version = "=4.0.0-rc.5", optional = true }
# Shared lattice trait (join/meet) leaf crate — for the semiring↔lattice bridge
llattice = { path = "../llattice", version = "=0.1.0", optional = true }

# Concurrent hash map for caching
dashmap = { version = "6.1", optional = true }

# F1R3FLY.io dependencies (optional)
# ">=0.2.2, <0.4" matches libdictenstein and liblevenshtein; a bare "0.2" would
# also admit 0.2.0/0.2.1, which those crates exclude.
pathmap = { version = ">=0.2.2, <0.4", optional = true }

# Data structures
smallvec = { version = "1.11", features = ["union"] }
indexmap = "2.0"
ahash = "0.8"
# 2.x changed the hash algorithm, so digests differ from 1.x. Safe here: every use
# is an in-memory FxHashMap/FxHashSet index, nothing is persisted.
rustc-hash = "2.1"

# Numerics
ordered-float = "4.0"

# Symbolic-automata + algebra-tower core (hoisted from prattail, Task #21 / ADR-018).
# Non-optional, default-on (no feature gates): the `symbolic` module is unconditional.
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint-std"] }
num-traits = "0.2"
moniker = { version = "0.5", features = ["moniker-derive"] }

# SMT `ConstraintTheory` backend (Task #22 / ADR-018, §4-B). The Z3 *library*
# (dynamically linked against the system libz3) is in-process — in-boundary for
# in-process use; the cvc5/Z3 *CLI* certificate path lives in the WFST sidecar.
# Default-on for Rust users, but optional so the standalone FFI/WASM binding
# artifacts do not drag an unrelated system solver into every consumer.

# Random number generation for path sampling
# 0.9.3 is the fix floor for RUSTSEC-2026-0097 (unsound with a custom logger using
# `rand::rng()`); the tree previously resolved 0.9.2.
rand = "0.9.3"
regex = "1"
regex-automata = "0.4"
rayon = { version = "1.11", optional = true }

# Hashing
blake3 = "1.5"

# Serialization (optional)
serde = { version = "1.0", features = ["derive"], optional = true }

# Proptest fixtures and strategies (optional; used by the test-utils feature).
proptest = { version = "1.4", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
z3 = { version = "0.12", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# rand 0.9 uses getrandom 0.3. Browser WebAssembly must opt into the host
# crypto backend; WASI selects its native random_get implementation instead.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.8", features = ["html_reports"] }

[features]
# Preserve the existing Rust surface by default. Native binding artifacts use
# `--no-default-features --features ffi` and therefore have no Z3 link contract.
default = ["smt-z3"]
smt-z3 = ["dep:z3"]

# Stable resource and C boundaries used by independently packaged language
# facades. These never pull in liblevenshtein or libdictenstein.
bindings-core = ["dep:vinary-tree-interop"]
ffi = ["bindings-core"]
native-bindings-full = ["ffi"]
c-bindings = ["native-bindings-full"]
cpp-bindings = ["native-bindings-full"]
python-bindings = ["native-bindings-full"]
jvm-bindings = ["native-bindings-full"]
clojure-bindings = ["jvm-bindings"]
javascript-bindings = ["bindings-core"]
typescript-bindings = ["javascript-bindings"]
clojurescript-bindings = ["javascript-bindings"]
dotnet-bindings = ["native-bindings-full"]
go-bindings = ["native-bindings-full"]
swift-bindings = ["native-bindings-full"]
ruby-bindings = ["native-bindings-full"]
fortran-bindings = ["native-bindings-full"]
ocaml-bindings = ["native-bindings-full"]
haskell-bindings = ["native-bindings-full"]
lua-bindings = ["native-bindings-full"]
julia-bindings = ["native-bindings-full"]
raku-bindings = ["native-bindings-full"]

# === Core Optional Features ===
# Integration with liblevenshtein for lexical correction
levenshtein = ["dep:liblevenshtein", "dep:libdictenstein", "dep:rayon"]

# libdictenstein lattice bridge: lling-llang semirings as dictionary values (cycle-break)
lattice = ["dep:llattice", "dep:libdictenstein"]
# ...with serde-bounded DictionaryValue for disk-backed (persistent-artrie) dictionaries
lattice-persistent = ["lattice", "libdictenstein/persistent-artrie", "dep:serde"]

# Probabilistic CFG support
pcfg = []

# Predefined error grammars (English, etc.)
error-grammar = []

# === Extension Layers ===
# POS tagging layer
pos-tagging = []

# Language model reranking layer
lm-rerank = []

# Phonetic rescoring layer (requires liblevenshtein with phonetic rules)
# Also needs serialization for serde support in phonetic types
phonetic-rescore = ["levenshtein", "dep:dashmap", "liblevenshtein?/embedded-rules", "liblevenshtein?/serialization"]

# Code correction layer (pattern-aware syntax recovery)
code-correction = []

# LaTeX syntax correction layer (CFG-based filtering, structural validation, repairs)
latex-syntax = []

# MathML semantic layer (type checking, homoglyph disambiguation)
mathml-semantic = []

# === F1R3FLY.io Integration (optional) ===
# Full F1R3FLY.io stack: PathMap, MORK, MeTTaTron, MeTTaIL
f1r3fly = ["dep:pathmap", "levenshtein", "sexpr"]

# S-expression path format for MORK compatibility
sexpr = []

# PathMap-optimized backend (part of f1r3fly)
pathmap-backend = ["dep:pathmap", "levenshtein", "liblevenshtein?/pathmap-backend"]

# === Serialization ===
serde = ["dep:serde", "liblevenshtein?/serde"]

# === Testing ===
# Expose the test_utils module (proptest strategies, fixtures) to downstream crates.
test-utils = ["dep:proptest"]

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "lazy_lifecycle_benchmarks"
harness = false

[[bench]]
name = "ffi_compose_benchmarks"
harness = false
required-features = ["ffi"]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# Keep this standalone repository from being captured by an unrelated parent
# workspace when it is checked out beneath another Rust project for validation.
[workspace]
