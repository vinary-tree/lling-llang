name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # All Rust dependencies in the vinary-tree release family are exact
      # crates.io dependencies, so a clean checkout has one coherent source
      # identity for every shared trait crate.

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-features --all-targets

      # Use --no-deps so warnings in vendored workspace dependencies
      # (PathMap, libdictenstein, ...) don't gate this crate's CI.
      - name: Clippy
        run: cargo clippy --all-features --all-targets --no-deps -- -D warnings

      - name: Test
        run: cargo test --all-features

  # ---------------------------------------------------------------------
  # Scalar-WFST resource ABI gate: the ffi + test-utils integration suites
  # (builder validation matrix, provider rejection matrix, laziness
  # metrics, round trip + arc paging law, lazy-composition correspondence,
  # concurrent composition stress) plus the binding-surface drift gate.
  #
  # vinary-tree-interop is compiled from the exact crates.io release. The C guide
  # also compiles against its standalone header, so CI checks out that repository
  # next to the workspace. Release workflows pin the exact tag.
  # ---------------------------------------------------------------------
  ffi:
    name: FFI and bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dev sibling crates
        shell: bash
        run: |
          set -euo pipefail
          parent="$(dirname "$GITHUB_WORKSPACE")"
          git clone --depth 1 --branch master \
            https://github.com/vinary-tree/vinary-tree-interop.git "$parent/vinary-tree-interop"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Binding-surface drift gate
        run: python3 scripts/check-bindings.py

      - name: Binding-documentation gate
        run: python3 scripts/check-binding-docs.py

      - name: C guide example
        shell: bash
        run: |
          cargo build --no-default-features --features ffi
          cc -std=c17 -Wall -Wextra -Werror \
            -Iinclude -I../vinary-tree-interop/include \
            bindings/c/examples/compose_demo.c \
            -Ltarget/debug -llling_llang \
            -Wl,-rpath,"$PWD/target/debug" \
            -o target/lling-c-compose
          target/lling-c-compose

      # Use --no-deps for the same reason as the main Rust job: warnings in
      # sibling path dependencies must not gate this crate's CI.
      - name: Clippy (ffi + test-utils, all test targets)
        run: >-
          cargo clippy --no-default-features --features "ffi test-utils"
          --tests --no-deps -- -D warnings

      - name: Test (ffi + test-utils)
        run: cargo test --no-default-features --features "ffi test-utils"

  # ---------------------------------------------------------------------
  # Dynamic-analysis gate (wave W8): the ffi + test-utils integration
  # suites run under AddressSanitizer (+ LeakSanitizer) and ThreadSanitizer
  # via nightly `-Zbuild-std`, which rebuilds std -- and every dependency,
  # including the registry-resolved vinary-tree-interop crate at the ABI boundary --
  # with the sanitizer runtime. This catches, at machine level, the classes
  # of defect safe Rust and catch_unwind cannot: use-after-free, OOB,
  # leaked retained provider snapshots (LeakSanitizer is the backstop for
  # the LLING-B5/B6 retain-ledger fixes), and data races across the
  # composition call gate (ffi_concurrent_composition_stress).
  #
  # Every sanitizer dependency is resolved from the locked registry graph; no
  # sibling source checkout is required.
  # ---------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan/TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: AddressSanitizer (+ LeakSanitizer) then ThreadSanitizer over the FFI/ABI suite
        run: bash scripts/run-sanitizers.sh

  # ---------------------------------------------------------------------
  # Supply-chain gate: published advisories, licence compatibility, banned
  # crates, and permitted sources. Configured in deny.toml.
  #
  # Added after a fleet-wide OSV sweep (2026-07) found five advisories in the
  # locked tree, all of them transitive. This job can fail on a commit that
  # changes nothing, because advisories are published against already-merged
  # code -- that is exactly why it exists.
  # ---------------------------------------------------------------------
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  proofs:
    name: Rocq and TLA+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y coq default-jre-headless curl
          curl -fsSL \
            -o "$RUNNER_TEMP/tla2tools.jar" \
            https://downloads.sourceforge.net/project/tlaplus.mirror/v1.7.4/tla2tools.jar
          echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Verify proofs and finite models
        run: make verify-proofs
