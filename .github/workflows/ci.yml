name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # --all-features resolves the four independently owned path dependencies
      # beside this checkout. Release workflows pin immutable tags instead.
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-features --all-targets

      # Use --no-deps so warnings in vendored workspace dependencies
      # (PathMap, libdictenstein, ...) don't gate this crate's CI.
      - name: Clippy
        run: cargo clippy --all-features --all-targets --no-deps -- -D warnings

      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Documentation math conformance
        run: |
          bash scripts/test-doc-math-prescan.sh
          scripts/doc-mathlint.sh

      - name: Test
        run: cargo test --all-features

  # ---------------------------------------------------------------------
  # Scalar-WFST resource ABI gate: the ffi + test-utils integration suites
  # (builder validation matrix, provider rejection matrix, laziness
  # metrics, round trip + arc paging law, lazy-composition correspondence,
  # concurrent composition stress) plus the binding-surface drift gate.
  #
  # Development CI resolves the coordinated sibling worktrees while release
  # workflows pin immutable tags for the same dependency family.
  # ---------------------------------------------------------------------
  ffi:
    name: FFI and bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Binding-surface drift gate
        run: python3 scripts/check-bindings.py

      - name: Binding-documentation gate
        run: python3 scripts/check-binding-docs.py

      - name: C guide example
        shell: bash
        run: |
          cargo build --no-default-features --features ffi
          cc -std=c17 -Wall -Wextra -Werror \
            -Iinclude -I../vinary-tree-interop/include \
            bindings/c/examples/compose_demo.c \
            -Ltarget/debug -llling_llang \
            -Wl,-rpath,"$PWD/target/debug" \
            -o target/lling-c-compose
          target/lling-c-compose

      - name: C++ RAII and host-lattice smoke test
        shell: bash
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude -I../vinary-tree-interop/include \
            bindings/cpp/tests/package_smoke.cpp \
            -Ltarget/debug -llling_llang \
            -Wl,-rpath,"$PWD/target/debug" \
            -o target/lling-cpp-package-smoke
          target/lling-cpp-package-smoke

      # Use --no-deps for the same reason as the main Rust job: warnings in
      # sibling path dependencies must not gate this crate's CI.
      - name: Clippy (ffi + test-utils, all test targets)
        run: >-
          cargo clippy --no-default-features --features "ffi test-utils"
          --tests --no-deps -- -D warnings

      - name: Test (ffi + test-utils)
        run: cargo test --no-default-features --features "ffi test-utils"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python validation tools and interop source
        run: |
          python -m pip install --disable-pip-version-check \
            build==1.6.0 pdoc==16.0.0 pyright==1.1.411 \
            ruff==0.16.5 tomli==2.2.1 twine==6.2.0
          python -m pip install --no-deps -e ../vinary-tree-interop/bindings/python
      - name: Build native Python library
        run: cargo build --no-default-features --features python-bindings
      - name: Type, style, API, and documentation gates
        env:
          LLING_LLANG_LIBRARY: ${{ github.workspace }}/target/debug/liblling_llang.so
          PYTHONPATH: ${{ github.workspace }}/bindings/python/src
        run: |
          ruff check bindings/python
          ruff format --check bindings/python
          pyright -p bindings/python/pyrightconfig.json
          python scripts/check-bindings.py
          python scripts/check-binding-docs.py
          pdoc --output-directory target/python-api lling_llang
      - name: Native integration and executable provider guide
        env:
          LLING_LLANG_LIBRARY: ${{ github.workspace }}/target/debug/liblling_llang.so
          PYTHONPATH: ${{ github.workspace }}/bindings/python/src
        run: |
          python -m unittest discover -s bindings/python/tests -v
          python bindings/python/examples/custom_providers.py
      - name: Build and test a fresh wheel
        if: matrix.python-version == '3.10'
        env:
          LLING_LLANG_PREBUILT_LIBRARY: ${{ github.workspace }}/target/debug/liblling_llang.so
        run: |
          python -m build --wheel --outdir target/python-dist bindings/python
          python -m twine check target/python-dist/*.whl
          python -m build --wheel --outdir target/python-interop-dist ../vinary-tree-interop/bindings/python
          python -m venv target/python-consumer
          target/python-consumer/bin/python -m pip install --no-deps target/python-interop-dist/*.whl
          target/python-consumer/bin/python -m pip install --no-deps target/python-dist/*.whl
          target/python-consumer/bin/python bindings/python/examples/custom_providers.py

  julia:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Build native binding library
        run: cargo build --no-default-features --features julia-bindings
      - name: Instantiate local package graph
        env:
          JULIA_DEPOT_PATH: ${{ github.workspace }}/target/julia-depot
        run: |
          julia --project=bindings/julia/LlingLlang -e '
            using Pkg
            Pkg.develop([
              Pkg.PackageSpec(path="../vinary-tree-interop/bindings/julia/VinaryTreeInterop"),
              Pkg.PackageSpec(path="../llattice/bindings/julia/LLattice"),
            ])
            Pkg.instantiate()
          '
      - name: Test Julia facade and host provider
        env:
          JULIA_DEPOT_PATH: ${{ github.workspace }}/target/julia-depot
          LLING_LLANG_LIBRARY: ${{ github.workspace }}/target/debug/liblling_llang.so
        run: julia --project=bindings/julia/LlingLlang bindings/julia/LlingLlang/test/runtests.jl
      - name: Build Documenter API reference
        env:
          JULIA_DEPOT_PATH: ${{ github.workspace }}/target/julia-depot
          LLING_LLANG_LIBRARY: ${{ github.workspace }}/target/debug/liblling_llang.so
          LLING_LLANG_DOCS_BUILD: ${{ github.workspace }}/target/julia-docs
        run: |
          julia --project=bindings/julia/LlingLlang/docs -e '
            using Pkg
            Pkg.develop([
              Pkg.PackageSpec(path="../vinary-tree-interop/bindings/julia/VinaryTreeInterop"),
              Pkg.PackageSpec(path="bindings/julia/LlingLlang"),
            ])
            Pkg.instantiate()
          '
          julia --project=bindings/julia/LlingLlang/docs bindings/julia/LlingLlang/docs/make.jl

  raku:
    name: Raku NativeCall and host provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      # Raku/setup-raku v1, pinned for a current, reproducible Rakudo rather
      # than Ubuntu's 2022.12 package.
      - uses: Raku/setup-raku@b8b1a4ebe85ef112edfc65e9edc8c57735367e3f
      - name: Documentation math conformance
        run: |
          bash scripts/test-doc-math-prescan.sh
          scripts/doc-mathlint.sh
      - name: Build native library and callback shim
        run: |
          cargo build --no-default-features --features raku-bindings
          mkdir -p target/raku-provider
          mkdir -p target/llattice-raku-provider
          RAKULIB="$PWD/../vinary-tree-interop/bindings/raku/lib" \
            raku bindings/raku/build-provider.raku \
              --output="$PWD/target/raku-provider/liblling_llang_raku_provider.so" \
              --interop-include="$PWD/../vinary-tree-interop/include"
          RAKULIB="$PWD/../vinary-tree-interop/bindings/raku/lib" \
            raku ../llattice/bindings/raku/build-provider.raku \
              --output="$PWD/target/llattice-raku-provider/libllattice_raku_provider.so" \
              --interop-include="$PWD/../vinary-tree-interop/include"
      - name: Test Raku facade and host provider
        env:
          LLING_LLANG_LIBRARY: ${{ github.workspace }}/target/debug/liblling_llang.so
          LLING_LLANG_RAKU_PROVIDER_LIB: ${{ github.workspace }}/target/raku-provider/liblling_llang_raku_provider.so
          LLATTICE_RAKU_PROVIDER_LIB: ${{ github.workspace }}/target/llattice-raku-provider/libllattice_raku_provider.so
          RAKULIB: ${{ github.workspace }}/bindings/raku/lib,${{ github.workspace }}/../llattice/bindings/raku/lib,${{ github.workspace }}/../vinary-tree-interop/bindings/raku/lib
        run: raku bindings/raku/t/01-conformance.rakutest
      - name: Render packaged Pod
        env:
          RAKULIB: ${{ github.workspace }}/bindings/raku/lib,${{ github.workspace }}/../vinary-tree-interop/bindings/raku/lib
        run: raku --doc=Text bindings/raku/doc/Lling-Llang.rakudoc > target/Lling-Llang.txt

  # ---------------------------------------------------------------------
  # Dynamic-analysis gate (wave W8): the ffi + test-utils integration
  # suites run under AddressSanitizer (+ LeakSanitizer) and ThreadSanitizer
  # via nightly `-Zbuild-std`, which rebuilds std -- and every dependency,
  # including the registry-resolved vinary-tree-interop crate at the ABI boundary --
  # with the sanitizer runtime. This catches, at machine level, the classes
  # of defect safe Rust and catch_unwind cannot: use-after-free, OOB,
  # leaked retained provider snapshots (LeakSanitizer is the backstop for
  # the LLING-B5/B6 retain-ledger fixes), and data races across the
  # composition call gate (ffi_concurrent_composition_stress).
  #
  # Every sanitizer dependency is resolved from the locked registry graph; no
  # sibling source checkout is required.
  # ---------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan/TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}

      - name: Install nightly toolchain with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: AddressSanitizer (+ LeakSanitizer) then ThreadSanitizer over the FFI/ABI suite
        run: bash scripts/run-sanitizers.sh

  # ---------------------------------------------------------------------
  # Supply-chain gate: published advisories, licence compatibility, banned
  # crates, and permitted sources. Configured in deny.toml.
  #
  # Added after a fleet-wide OSV sweep (2026-07) found five advisories in the
  # locked tree, all of them transitive. This job can fail on a commit that
  # changes nothing, because advisories are published against already-merged
  # code -- that is exactly why it exists.
  # ---------------------------------------------------------------------
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          coordinated-ref: ${{ github.head_ref || github.ref_name }}
      # A Docker action can only mount this repository and therefore cannot
      # resolve the sibling path dependencies. Install the same cargo-deny
      # executable directly into the complete runner filesystem instead.
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories bans sources licenses

  rocq-proofs:
    name: Rocq proofs
    runs-on: ubuntu-latest
    # Match llattice's canonical proof environment. The digest prevents a
    # moved container tag from changing proof semantics underneath a commit.
    container:
      image: rocq/rocq-prover:9.1.1@sha256:b85a80a11bb65c7c843f91c7cbcce282f22ee397c9ca42f123d568ab6cef68b0
      # GitHub owns the workspace and runner-command mounts as UID 1001. Keep
      # that UID while using the Rocq image's group 1000, whose opam tree is
      # deliberately group-accessible. This satisfies both mount and toolchain
      # permissions without granting the proof process root privileges.
      options: --user 1001:1000
    steps:
      - uses: actions/checkout@v6
      - name: Verify Rocq proofs
        env:
          # GitHub replaces the image entrypoint (`opam exec --`) when it
          # starts a job container. Restore the image's pinned opam switch
          # explicitly while running as the mount-compatible user above.
          OPAMROOT: /home/rocq/.opam
        run: |
          opam exec -- rocq --version | grep -F "version 9.1.1"
          opam exec -- bash proofs/verify.sh --rocq-only

  tla-models:
    name: TLA+ finite models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Install the checksum-pinned TLA+ tools
        shell: bash
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "16b8cd970e07147ff91f126baecba7edd98202e5ab33220a42f8f4358ee94b2b  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum --check --strict
          echo "TLA2TOOLS_JAR=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Verify portable invariant registries and finite models
        run: bash proofs/verify.sh --tla-only
