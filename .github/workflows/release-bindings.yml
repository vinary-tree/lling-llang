name: Release lling-llang bindings

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact related releases
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v0.2.1 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v0.10.0 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo test --no-default-features --features ffi
      - run: cargo clippy --no-default-features --features ffi --lib -- -D warnings
      - run: npm test --prefix bindings/javascript

  native:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact ABI dependency
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.10.0 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo build --release --no-default-features --features ffi
      - run: scripts/stage-native-package.sh "${{ matrix.target }}" target/release dist
        shell: bash
      - name: Test installed CMake package with shared and static linkage
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          prefix="$PWD/dist/lling-llang-${version}-${{ matrix.target }}"
          cmake -S bindings/cpp/tests/package -B target/cmake-shared \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build target/cmake-shared --config Release
          case "$RUNNER_OS" in
            Linux) LD_LIBRARY_PATH="$prefix/lib" target/cmake-shared/lling_llang_package_smoke ;;
            macOS) DYLD_LIBRARY_PATH="$prefix/lib" target/cmake-shared/lling_llang_package_smoke ;;
            Windows) PATH="$prefix/bin:$PATH" target/cmake-shared/Release/lling_llang_package_smoke.exe ;;
          esac
          cmake -S bindings/cpp/tests/package -B target/cmake-static \
            -DCMAKE_PREFIX_PATH="$prefix" -DLLING_LLANG_LINKAGE=STATIC
          cmake --build target/cmake-static --config Release
          if [[ "$RUNNER_OS" == Windows ]]; then
            target/cmake-static/Release/lling_llang_package_smoke.exe
          else
            target/cmake-static/lling_llang_package_smoke
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  npm-package:
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm test
        working-directory: bindings/javascript
      - run: npm pack --pack-destination ../../../dist
        working-directory: bindings/javascript
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  npm:
    needs: npm-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: dist }
      - run: npm publish --access public --provenance dist/*.tgz

  crates-io:
    needs: contract
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact related releases
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v0.2.1 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v0.10.0 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
      - uses: dtolnay/rust-toolchain@1.95
      - run: sudo apt-get update && sudo apt-get install -y libz3-dev clang
      - run: cargo publish
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }

  github-release:
    needs: [native, npm-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { pattern: native-*, path: assets, merge-multiple: true }
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: assets }
      - run: cd assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: { files: "assets/*", generate_release_notes: true }
