name: Release lling-llang bindings

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Publish one registry from an immutable release tag
        required: true
        type: choice
        default: validate-only
        options:
          - validate-only
          - npm
          - pypi
          - crates-io

permissions:
  contents: read

concurrency:
  group: lling-llang-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact release dependencies
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/vinary-tree-interop.git "$parent/vinary-tree-interop"
      - uses: dtolnay/rust-toolchain@1.95
        with: { components: clippy }
      - run: python3 scripts/sync-release-version.py
      - name: Verify immutable tag matches the package version
        run: >-
          python3 scripts/check-release-ref.py
          --ref "$GITHUB_REF"
          --ref-name "$GITHUB_REF_NAME"
          --registry "${{ inputs.registry }}"
      - run: python3 scripts/check-release-ref.py --self-test
      - run: cargo test --no-default-features --features ffi
      # The full ABI contract battery also needs the test-utils strategies
      # (round trip + lazy-composition correspondence proptests).
      - run: cargo test --no-default-features --features "ffi test-utils"
      - run: cargo clippy --no-default-features --features ffi --lib -- -D warnings
      - run: npm test --prefix bindings/javascript

  native:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact release dependencies
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/vinary-tree-interop.git "$parent/vinary-tree-interop"
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo build --release --no-default-features --features ffi
      - run: scripts/stage-native-package.sh "${{ matrix.target }}" target/release dist
        shell: bash
      - name: Test installed CMake package with shared and static linkage
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          prefix="$PWD/dist/lling-llang-${version}-${{ matrix.target }}"
          parent=$(dirname "$GITHUB_WORKSPACE")
          (cd "$parent/vinary-tree-interop" && scripts/stage-native-package.sh "$GITHUB_WORKSPACE/dist/interop")
          interop_prefix="$GITHUB_WORKSPACE/dist/interop/vinary-tree-interop-4.0.0-rc.6"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmake_prefix="$(cygpath -m "$interop_prefix");$(cygpath -m "$prefix")"
          else
            cmake_prefix="$interop_prefix;$prefix"
          fi
          cmake -S bindings/cpp/tests/package -B target/cmake-shared \
            -DCMAKE_PREFIX_PATH="$cmake_prefix"
          cmake --build target/cmake-shared --config Release
          case "$RUNNER_OS" in
            Linux) LD_LIBRARY_PATH="$prefix/lib" target/cmake-shared/lling_llang_package_smoke ;;
            macOS) DYLD_LIBRARY_PATH="$prefix/lib" target/cmake-shared/lling_llang_package_smoke ;;
            Windows) PATH="$prefix/bin:$PATH" target/cmake-shared/Release/lling_llang_package_smoke.exe ;;
          esac
          cmake -S bindings/cpp/tests/package -B target/cmake-static \
            -DCMAKE_PREFIX_PATH="$cmake_prefix" -DLLING_LLANG_LINKAGE=STATIC
          cmake --build target/cmake-static --config Release
          if [[ "$RUNNER_OS" == Windows ]]; then
            target/cmake-static/Release/lling_llang_package_smoke.exe
          else
            target/cmake-static/lling_llang_package_smoke
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  npm-package:
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm test
        working-directory: bindings/javascript
      - name: Pack the JavaScript facade artifact
        working-directory: bindings/javascript
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  python-wheels:
    name: Python wheel ${{ matrix.platform }}
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            arch: aarch64
          - runner: macos-26
            platform: macos-aarch64
            arch: arm64
          - runner: windows-2025
            platform: windows-x86_64
            arch: AMD64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact Python interop dependency
        shell: bash
        run: >-
          git clone --depth 1 --branch v4.0.0-rc.6
          https://github.com/vinary-tree/vinary-tree-interop.git
          .release-deps/vinary-tree-interop
      - uses: dtolnay/rust-toolchain@1.95
      - uses: ./.github/actions/pin-siblings-cratesio
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build and test platform wheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_TEST: >-
            python -m pip install --no-deps
            {project}/.release-deps/vinary-tree-interop/bindings/python
          CIBW_TEST_COMMAND: >-
            python -m unittest discover
            -s {project}/bindings/python/tests -v &&
            python {project}/bindings/python/examples/custom_providers.py
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.95
          CIBW_ENVIRONMENT_LINUX: >-
            PATH=$HOME/.cargo/bin:$PATH
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  npm:
    needs: npm-package
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'npm'
    runs-on: ubuntu-24.04
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: dist }
      - run: npm publish --access public --provenance --tag next ./dist/*.tgz

  pypi:
    name: Publish PyPI wheels
    needs: python-wheels
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'pypi'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          packages-dir: dist

  crates-io:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'crates-io'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact related releases
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
          git clone --depth 1 --branch v4.0.0-rc.6 https://github.com/vinary-tree/vinary-tree-interop.git "$parent/vinary-tree-interop"
      - uses: dtolnay/rust-toolchain@1.95
      - run: sudo apt-get update && sudo apt-get install -y libz3-dev clang
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.crates-io-auth.outputs.token }}" }

  github-release:
    needs: [native, npm-package, python-wheels]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      inputs.registry == 'validate-only'
    runs-on: ubuntu-24.04
    environment: github-release
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { pattern: native-*, path: assets, merge-multiple: true }
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: assets }
      - uses: actions/download-artifact@v7
        with: { pattern: python-wheel-*, path: assets, merge-multiple: true }
      - run: cd assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: "assets/*"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
