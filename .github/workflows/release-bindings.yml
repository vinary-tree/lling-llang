name: Release lling-llang bindings

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      registry:
        description: Publish one registry from an immutable release tag
        required: true
        type: choice
        default: validate-only
        options:
          - validate-only
          - npm
          - crates-io

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact related releases
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/vinary-tree-interop.git "$parent/vinary-tree-interop"
      - uses: dtolnay/rust-toolchain@1.95
        with: { components: clippy }
      - name: Verify immutable tag matches the package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Manual releases must be dispatched against an immutable tag." >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo test --no-default-features --features ffi
      # The full ABI contract battery also needs the test-utils strategies
      # (round trip + lazy-composition correspondence proptests).
      - run: cargo test --no-default-features --features "ffi test-utils"
      - run: cargo clippy --no-default-features --features ffi --lib -- -D warnings
      - run: npm test --prefix bindings/javascript

  native:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact release dependencies
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/vinary-tree-interop.git "$parent/vinary-tree-interop"
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo build --release --no-default-features --features ffi
      - run: scripts/stage-native-package.sh "${{ matrix.target }}" target/release dist
        shell: bash
      - name: Test installed CMake package with shared and static linkage
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          prefix="$PWD/dist/lling-llang-${version}-${{ matrix.target }}"
          parent=$(dirname "$GITHUB_WORKSPACE")
          (cd "$parent/vinary-tree-interop" && scripts/stage-native-package.sh "$GITHUB_WORKSPACE/dist/interop")
          interop_prefix="$GITHUB_WORKSPACE/dist/interop/vinary-tree-interop-4.0.0-rc.1"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmake_prefix="$(cygpath -m "$interop_prefix");$(cygpath -m "$prefix")"
          else
            cmake_prefix="$interop_prefix;$prefix"
          fi
          cmake -S bindings/cpp/tests/package -B target/cmake-shared \
            -DCMAKE_PREFIX_PATH="$cmake_prefix"
          cmake --build target/cmake-shared --config Release
          case "$RUNNER_OS" in
            Linux) LD_LIBRARY_PATH="$prefix/lib" target/cmake-shared/lling_llang_package_smoke ;;
            macOS) DYLD_LIBRARY_PATH="$prefix/lib" target/cmake-shared/lling_llang_package_smoke ;;
            Windows) PATH="$prefix/bin:$PATH" target/cmake-shared/Release/lling_llang_package_smoke.exe ;;
          esac
          cmake -S bindings/cpp/tests/package -B target/cmake-static \
            -DCMAKE_PREFIX_PATH="$cmake_prefix" -DLLING_LLANG_LINKAGE=STATIC
          cmake --build target/cmake-static --config Release
          if [[ "$RUNNER_OS" == Windows ]]; then
            target/cmake-static/Release/lling_llang_package_smoke.exe
          else
            target/cmake-static/lling_llang_package_smoke
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  npm-package:
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm test
        working-directory: bindings/javascript
      - name: Pack the JavaScript facade artifact
        working-directory: bindings/javascript
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  npm:
    needs: npm-package
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'npm'
    runs-on: ubuntu-24.04
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: dist }
      - run: npm publish --access public --provenance --tag next dist/*.tgz

  crates-io:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'crates-io'
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Checkout exact related releases
        shell: bash
        run: |
          parent=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 --branch v0.1.0 https://github.com/vinary-tree/llattice.git "$parent/llattice"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/libdictenstein.git "$parent/libdictenstein"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/liblevenshtein-rust.git "$parent/liblevenshtein-rust"
          git clone --depth 1 --branch v4.0.0-rc.1 https://github.com/vinary-tree/vinary-tree-interop.git "$parent/vinary-tree-interop"
      - uses: dtolnay/rust-toolchain@1.95
      - run: sudo apt-get update && sudo apt-get install -y libz3-dev clang
      - run: cargo publish
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }

  github-release:
    needs: [native, npm-package]
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.registry == 'validate-only'))
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { pattern: native-*, path: assets, merge-multiple: true }
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: assets }
      - run: cd assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: "assets/*"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
