# Cargo configuration for lling-llang.
#
# Gxhash requires AES plus SSE2 on x86 or NEON on ARM. Keep those minimums
# architecture-specific and never select `target-cpu=native` for repository
# defaults: shipped artifacts must not inherit the release runner's optional
# instruction sets.

[target.'cfg(all(any(target_arch = "x86", target_arch = "x86_64"), any(target_os = "linux", target_os = "macos", target_os = "windows")))']
rustflags = ["-C", "target-feature=+aes,+sse2"]

[target.'cfg(all(any(target_arch = "arm", target_arch = "aarch64"), any(target_os = "linux", target_os = "macos", target_os = "windows")))']
rustflags = ["-C", "target-feature=+aes,+neon"]

# Allow cdylib production on musl by selecting its dynamic CRT. Cargo joins
# these exact-target flags with the architecture cfg flags above.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes,+sse2,-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+aes,+neon,-crt-static"]

# Developers may opt into local-machine-only optimization explicitly with
# `RUSTFLAGS="-C target-cpu=native" cargo bench`; release artifacts may not.

# ==============================================================================
# Git Configuration
# ==============================================================================
# Use system git for submodule fetching instead of libgit2
# This resolves SSH authentication issues with git submodules in dependencies
[net]
git-fetch-with-cli = true
